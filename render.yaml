# render.yaml — Render.com infrastructure-as-code
# Deploy the FastAPI backend as a Web Service on Render.
# Docs: https://render.com/docs/render-yaml-spec

services:
  - type: web
    name: diagnostic-radiography-api
    runtime: python
    region: oregon          # Change to: frankfurt | singapore | ohio as needed
    plan: standard          # standard = 2GB RAM — needed for PyTorch + TF together
                            # ⚠️ free tier (512MB) is NOT sufficient for this stack
    rootDir: backend        # Only the backend/ folder is used

    buildCommand: pip install -r requirements.txt

    startCommand: >
      uvicorn main:app
      --host 0.0.0.0
      --port $PORT
      --workers 1
      --timeout-keep-alive 120

    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"

      # Set to "true" when running locally with models already on disk.
      # On Render, keep this as "false" so models download from Drive on boot.
      - key: SKIP_MODEL_DOWNLOAD
        value: "false"

      # ONNX model Drive files (bare ID or full share link both work)
      - key: GDRIVE_PARENT_MODEL_ROUTER_ONNX
        value: "1Q50tPSYmtkN5ytYb4VExPSIPyqAmZ4O-"
      - key: GDRIVE_BRAIN_MODEL_ONNX
        value: "12YIQGVnvEWHrzligj4RwwI7o2pkP8QmP"
      - key: GDRIVE_LUNG_MODEL_ONNX
        value: "108hSZ0YvuuN3j3gulhUHCMjHmPos6hAk"
      - key: GDRIVE_BREAST_MODEL_ONNX
        value: "165M-Q2a3EdxAjzh8heqXDgLVtaAYNI8m"
      - key: GDRIVE_BONE_MODEL_ONNX
        value: "1DjOSChB0AK2gPcxVjjV25w1ur2sgUczN"

      # Patient registry (MongoDB) — secrets are entered in the Render dashboard, never committed
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: "cancerlens"
      - key: PATIENT_DATA_KEY      # generate: python manage_patients.py genkey — back it up!
        sync: false
      - key: PATIENT_API_KEY       # same value must be set on Vercel (server-side only) — login fails without it
        sync: false
      - key: SESSION_TTL_HOURS     # how long a hospital login lasts
        value: "12"
      - key: HOSPITAL_REGISTRATION_CODE   # optional: when set, new hospitals need this code to register
        sync: false

      # Patient report e-mails (Brevo) — sender must be verified in Brevo
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: "CancerLens"

      # Patient scan images → Google Drive, one sub-folder per patient (run backend/drive_auth.py once)
      - key: PATIENT_IMAGES_FOLDER_ID
        value: "17NarJWbC29SH3p1q4vj5GuII5iChd8KA"
      - key: GDRIVE_OAUTH_CLIENT_ID
        sync: false
      - key: GDRIVE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GDRIVE_OAUTH_REFRESH_TOKEN
        sync: false

      # Extra CORS origins beyond Vercel + localhost (comma-separated, optional)
      - key: RENDER_ALLOWED_ORIGINS
        value: ""
