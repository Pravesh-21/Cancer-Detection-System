# render.yaml — Render.com infrastructure-as-code
# Deploy the FastAPI backend as a Web Service on Render.
# Docs: https://render.com/docs/render-yaml-spec

services:
  - type: web
    name: diagnostic-radiography-api
    runtime: python
    region: oregon          # Change to: frankfurt | singapore | ohio as needed
    plan: standard          # standard = 2GB RAM — needed for PyTorch + TF together
                            # ⚠️ free tier (512MB) is NOT sufficient for this stack
    rootDir: backend        # Only the backend/ folder is used

    buildCommand: pip install -r requirements.txt

    startCommand: >
      uvicorn main:app
      --host 0.0.0.0
      --port $PORT
      --workers 1
      --timeout-keep-alive 120

    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"

      # Set to "true" when running locally with models already on disk.
      # On Render, keep this as "false" so models download from Drive on boot.
      - key: SKIP_MODEL_DOWNLOAD
        value: "false"

      # ONNX model Drive files (bare ID or full share link both work)
      - key: GDRIVE_PARENT_MODEL_ROUTER_ONNX
        value: "1Q50tPSYmtkN5ytYb4VExPSIPyqAmZ4O-"
      - key: GDRIVE_BRAIN_MODEL_ONNX
        value: "12YIQGVnvEWHrzligj4RwwI7o2pkP8QmP"
      - key: GDRIVE_LUNG_MODEL_ONNX
        value: "108hSZ0YvuuN3j3gulhUHCMjHmPos6hAk"
      - key: GDRIVE_BREAST_MODEL_ONNX
        value: "165M-Q2a3EdxAjzh8heqXDgLVtaAYNI8m"
      - key: GDRIVE_BONE_MODEL_ONNX
        value: "1DjOSChB0AK2gPcxVjjV25w1ur2sgUczN"

      # Extra CORS origins beyond Vercel + localhost (comma-separated, optional)
      - key: RENDER_ALLOWED_ORIGINS
        value: ""
